name: ReaPack index

on:
  push:
    branches: [master]
    paths-ignore:
      - index.xml

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install reapack-index
        run: gem install reapack-index --no-document
      - name: Validate metadata
        run: reapack-index --check .
      - name: Update index
        run: reapack-index --scan .
      - name: Commit index
        run: |
          if git diff --quiet -- index.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.xml
          git commit -m "index: update [ci skip]"
          git push
