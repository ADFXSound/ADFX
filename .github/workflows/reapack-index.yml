name: ReaPack index

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install reapack-index
        run: gem install reapack-index --no-document

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # IMPORTANT:
      # reapack-index --commit creates the commit itself,
      # so Git identity must exist BEFORE running it.
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate and commit ReaPack index
        run: reapack-index --commit

      - name: Push generated index
        run: git push